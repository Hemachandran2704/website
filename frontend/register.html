<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Magnus Dynamic CMS</title>
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="stylesheet" href="/frontend/css/forms.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-logo">M</div>
        <h1 class="auth-title">Magnus CMS</h1>
        <p class="auth-subtitle">Create your account to access the management portal</p>
      </div>

      <div id="register-error" class="form-error" style="display: none; padding: 10px 14px; background: #fee2e2; border-radius: 6px; margin-bottom: 16px; border: 1px solid #fca5a5;"></div>

      <form id="register-form" method="POST" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full Name <span class="required">*</span></label>
          <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required autocomplete="name" spellcheck="false">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="user@magnus.com" required autocomplete="email" spellcheck="false">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password <span class="required">*</span></label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.85rem;">
        <span style="color: var(--text-muted);">Already have an account?</span>
        <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: none; margin-left: 4px;">Sign In</a>
      </div>

      <div style="text-align: center; margin-top: 16px; font-size: 0.8rem; color: var(--text-muted);">
        Magnus Dynamic Content Management System &bull; Secure Registration
      </div>
    </div>
  </div>

  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Auth.initRegisterPage();
    });
  </script>
</body>
</html>
